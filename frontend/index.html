<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 小说转剧本工具</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI 小说转剧本工具</h1>
            <p class="subtitle">将小说文本自动转换为结构化 YAML 剧本</p>
        </header>

        <main>
            <details class="api-settings">
                <summary>API 设置（可选）</summary>
                <div class="api-settings-body">
                    <div class="form-group">
                        <label for="api-key">API Key</label>
                        <input type="password" id="api-key" placeholder="留空则使用服务器默认密钥">
                    </div>
                    <div class="form-group">
                        <label for="api-base">API Base URL</label>
                        <input type="text" id="api-base" placeholder="如 https://api.openai.com/v1">
                    </div>
                    <div class="form-group">
                        <label for="model-name">模型名称</label>
                        <input type="text" id="model-name" placeholder="如 mimo-v2.5-pro">
                    </div>
                </div>
            </details>

            <section class="input-section">
                <div class="form-group">
                    <label for="title">作品标题</label>
                    <input type="text" id="title" placeholder="请输入作品标题" value="未命名作品">
                </div>
                <div class="form-group">
                    <label for="novel-text">小说文本</label>
                    <textarea id="novel-text" rows="12" placeholder="请粘贴小说文本（支持多章节）..."></textarea>
                </div>
                <div class="btn-group">
                    <label class="btn btn-secondary" for="file-upload">上传文件</label>
                    <input type="file" id="file-upload" accept=".txt,.docx,.pdf" hidden>
                    <span id="file-name" class="file-name"></span>
                    <button id="btn-convert" class="btn btn-primary">开始转换</button>
                    <button id="btn-edit" class="btn btn-secondary" disabled>编辑</button>
                    <button id="btn-export-yaml" class="btn btn-secondary" disabled>导出 YAML</button>
                    <button id="btn-export-json" class="btn btn-secondary" disabled>导出 JSON</button>
                    <button id="btn-export-docx" class="btn btn-secondary" disabled>导出 DOCX</button>
                </div>
            </section>

            <section class="output-section">
                <div class="tabs">
                    <button class="tab active" data-tab="preview">剧本预览</button>
                    <button class="tab" data-tab="yaml">YAML 源码</button>
                    <button id="btn-toggle-sidebar" class="btn-sidebar-toggle" title="切换场景导航">☰</button>
                </div>
                <div id="preview" class="tab-content active">
                    <div class="split-pane">
                        <aside id="scene-sidebar" class="scene-sidebar">
                            <h4 class="sidebar-title">场景导航</h4>
                            <ul id="scene-list" class="scene-list"></ul>
                            <div id="character-panel" class="character-panel" style="display:none;">
                                <h4 class="sidebar-title">角色列表 <span id="character-count" class="character-count"></span></h4>
                                <div id="character-list" class="character-list"></div>
                            </div>
                        </aside>
                        <div class="divider" id="divider"></div>
                        <div id="screenplay-preview" class="preview-placeholder pane-right">
                            转换结果将在这里显示...
                        </div>
                    </div>
                </div>
                <div id="yaml" class="tab-content">
                    <pre id="yaml-output" class="yaml-code">YAML 源码将在这里显示...</pre>
                </div>
            </section>
        </main>

        <footer>
            <p>Powered by Xiaomi MiMo | AI 小说转剧本工具</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
